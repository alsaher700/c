<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>طقس غزة</title>
<style>
/*FONTS*/

:root {
  --page: #F3EDE2;          /* sand cream */
  --card: #FFFFFF;
  --ink: #0B2E4A;           /* deep sea navy */
  --ink-2: #4E6274;
  --ink-3: #7D8B97;
  --sky: #0B62BF;
  --hi: #E0702A;            /* sunset orange — validated pair */
  --lo: #0E93B3;            /* sea teal */
  --olive-1: #5F7F31;
  --olive-2: #3E5A22;
  --wheat: #FFE39A;
  --cream: #F7F1E2;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; }
body {
  font-family: 'IBM Plex Sans Arabic', sans-serif; color: var(--ink);
  background: var(--page); overflow: hidden;
}
.n { direction: ltr; unicode-bidi: isolate; display: inline-block; }

.poster {
  position: relative; width: 1080px; height: 1350px; overflow: hidden;
  padding: 32px; display: flex; flex-direction: column;
  background: var(--page);
}

/* ================= scene ================= */
.scene {
  position: relative; height: 624px; border-radius: 44px; overflow: hidden; flex: none;
  box-shadow: 0 24px 48px -20px rgba(11, 46, 74, .35);
}
.scene svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.title { position: absolute; top: 28px; right: 40px; color: #fff; text-align: right; }
.title h1 {
  font-family: 'Alexandria'; font-weight: 900; font-size: 56px; line-height: 1.15;
  text-shadow: 0 4px 18px rgba(0, 40, 90, .25);
}
.title .loc {
  display: inline-flex; align-items: center; gap: 6px; margin-bottom: 2px;
  font-size: 16px; font-weight: 600;
  padding: 3px 14px 3px 12px; border-radius: 999px;
  background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .38);
  backdrop-filter: blur(8px);
}
.title .loc svg { width: 16px; height: 16px; }

.date {
  position: absolute; top: 34px; left: 34px;
  padding: 16px 24px 16px 22px; border-radius: 26px;
  background: rgba(255, 255, 255, .93);
  box-shadow: 0 10px 30px -10px rgba(0, 40, 90, .35);
  display: flex; gap: 16px; align-items: center;
}
.date .cal {
  width: 58px; height: 62px; border-radius: 16px; overflow: hidden; flex: none;
  background: #fff; border: 1.5px solid #E3E9EF; text-align: center;
}
.date .cal .m { background: var(--hi); color: #fff; font-size: 13px; font-weight: 700; line-height: 20px; }
.date .cal .d { font-family: 'Alexandria'; font-weight: 800; font-size: 28px; line-height: 40px; color: var(--ink); }
.date .day { font-family: 'Alexandria'; font-size: 26px; font-weight: 800; color: var(--sky); line-height: 1.25; }
.date .greg { font-size: 19px; font-weight: 700; line-height: 1.4; }
.date .hijri { font-size: 15px; font-weight: 600; color: var(--ink-3); line-height: 1.4; }

.hero { position: absolute; top: 140px; right: 40px; color: #fff; text-align: right; }
.temp {
  font-family: 'Alexandria'; font-weight: 800; font-size: 196px; line-height: .92; letter-spacing: -5px;
  direction: ltr; display: flex; justify-content: flex-end; align-items: flex-start;
  text-shadow: 0 14px 40px rgba(0, 40, 90, .28);
}
.temp sup { font-size: 104px; line-height: 1; margin-left: 4px; color: #FFE08A; letter-spacing: 0; }
.cond {
  font-family: 'Alexandria'; font-size: 44px; font-weight: 800; line-height: 1.2; margin-top: 2px;
  text-shadow: 0 2px 4px rgba(0, 40, 90, .25), 0 6px 24px rgba(0, 40, 90, .45);
}
.chips { display: flex; gap: 10px; justify-content: flex-start; margin-top: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255, 255, 255, .95); color: var(--ink);
  padding: 6px 16px 6px 14px; border-radius: 999px;
  font-size: 18px; font-weight: 600;
  box-shadow: 0 8px 20px -10px rgba(0, 40, 90, .45);
}
.chip b { font-family: 'Alexandria'; font-weight: 800; font-size: 21px; }
.chip svg { width: 14px; height: 14px; }

.stats {
  position: absolute; left: 18px; right: 18px; bottom: 18px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.stat {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 24px;
  background: rgba(255, 255, 255, .95);
  box-shadow: 0 10px 24px -14px rgba(80, 50, 10, .45);
}
.stat .badge { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.stat .badge svg { width: 28px; height: 28px; }
.stat .k { font-size: 15px; color: var(--ink-3); font-weight: 600; line-height: 1.3; }
.stat .v { font-family: 'Alexandria'; font-size: 23px; font-weight: 800; line-height: 1.25; }

/* ================= week ================= */
.week {
  margin-top: 20px; height: 300px; flex: none;
  background: var(--card); border-radius: 36px; padding: 22px 24px 16px;
  box-shadow: 0 18px 40px -26px rgba(80, 50, 10, .35);
  display: flex; flex-direction: column;
}
.week .head { display: flex; justify-content: space-between; align-items: center; height: 34px; }
.week h2 { font-family: 'Alexandria'; font-size: 25px; font-weight: 800; }
.week h2 span { font-family: 'IBM Plex Sans Arabic'; font-size: 16px; font-weight: 600; color: var(--ink-3); margin-right: 10px; }
.legend { display: flex; gap: 18px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 4px; vertical-align: middle; margin-left: 7px; }

.grid { position: relative; flex: 1; margin-top: 10px; }
.cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
.col { display: flex; flex-direction: column; align-items: center; padding-top: 8px; border-radius: 22px; margin: 0 3px; }
.col.today { background: linear-gradient(180deg, #E3F2FB, #F2F9FD); }
.col .dn { font-size: 19px; font-weight: 700; line-height: 1.3; }
.col.today .dn { color: var(--sky); }
.col .dd { font-size: 13px; color: var(--ink-3); font-weight: 600; line-height: 1.3; }
.col .ic { width: 46px; height: 46px; margin-top: 4px; }
.chart { position: absolute; left: 0; right: 0; bottom: 0; height: 118px; }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* ================= hadith ================= */
.hadith {
  position: relative; margin-top: 20px; height: 216px; flex: none; overflow: hidden;
  border-radius: 36px; text-align: center; color: var(--cream);
  padding: 20px 56px 14px;
  background:
    radial-gradient(500px 220px at 50% 0%, rgba(255, 227, 154, .16), transparent 70%),
    linear-gradient(135deg, var(--olive-1), var(--olive-2));
  box-shadow: 0 18px 40px -24px rgba(62, 90, 34, .7);
}
.hadith .branch { position: absolute; width: 200px; height: 200px; opacity: .22; }
.hadith .branch.r { right: -10px; bottom: -30px; }
.hadith .branch.l { left: -10px; bottom: -30px; transform: scaleX(-1); }
.hadith .tag {
  position: relative;
  display: inline-block; font-size: 15px; font-weight: 700; color: var(--olive-2);
  background: var(--cream); padding: 3px 16px; border-radius: 999px;
}
.hadith .lead { position: relative; font-family: 'Amiri', serif; font-size: 26px; line-height: 1.5; margin-top: 6px; opacity: .92; }
.hadith .quote { position: relative; font-family: 'Amiri', serif; font-weight: 700; font-size: 52px; line-height: 1.35; color: var(--wheat); margin-top: 10px; }
.hadith .ref { position: relative; font-size: 15px; font-weight: 600; opacity: .75; }
.hadith .ref b { font-weight: 700; }

/* ================= footer ================= */
.foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
.qr { display: flex; align-items: center; gap: 16px; }
.qr .code {
  width: 86px; height: 86px; padding: 7px; background: #fff; border-radius: 18px;
  box-shadow: 0 8px 20px -12px rgba(80, 50, 10, .4);
}
.qr .code svg { width: 100%; height: 100%; display: block; }
.qr .t1 { font-family: 'Alexandria'; font-size: 20px; font-weight: 800; line-height: 1.35; }
.qr .t2 { font-size: 16px; color: var(--ink-2); font-weight: 600; line-height: 1.5; }
.qr .g { font-family: 'Alexandria'; font-weight: 800; direction: ltr; unicode-bidi: isolate; }
.qr .g span:nth-child(1) { color: #4285F4; } .qr .g span:nth-child(2) { color: #EA4335; }
.qr .g span:nth-child(3) { color: #FBBC05; } .qr .g span:nth-child(4) { color: #4285F4; }
.qr .g span:nth-child(5) { color: #34A853; } .qr .g span:nth-child(6) { color: #EA4335; }
.src { text-align: left; font-size: 14px; color: var(--ink-3); font-weight: 600; line-height: 1.6; }
.src b { color: var(--ink-2); }
</style>
</head>
<body>
<div class="poster" id="poster">

  <section class="scene">
    <div id="scene"></div>
    <div class="title">
      <div class="loc">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span id="place"></span>
      </div>
      <h1>طقس غزة</h1>
    </div>
    <div class="date">
      <div class="cal"><div class="m" id="calM"></div><div class="d" id="calD"></div></div>
      <div>
        <div class="day" id="dayName"></div>
        <div class="greg" id="greg"></div>
        <div class="hijri" id="hijri"></div>
      </div>
    </div>
    <div class="hero">
      <div class="temp"><span id="temp"></span><sup>°</sup></div>
      <div class="cond" id="cond"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="week">
    <div class="head">
      <h2>توقعات الأسبوع<span id="span"></span></h2>
      <div class="legend"><span><i style="background:var(--hi)"></i>العظمى</span><span><i style="background:var(--lo)"></i>الصغرى</span></div>
    </div>
    <div class="grid">
      <div class="cols" id="cols"></div>
      <div class="chart" id="chart"></div>
    </div>
  </section>

  <section class="hadith">
    <svg class="branch r" viewBox="0 0 200 200" id="branchR"></svg>
    <svg class="branch l" viewBox="0 0 200 200" id="branchL"></svg>
    <div class="tag" id="htag"></div>
    <div class="lead" id="hlead"></div>
    <div class="quote" id="hquote"></div>
    <div class="ref" id="href"></div>
  </section>

  <footer class="foot">
    <div class="qr">
      <div class="code" id="qr"></div>
      <div>
        <div class="t1">امسح الرمز لمتابعة طقس غزة</div>
        <div class="t2">مباشرةً على <span class="g"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></span></div>
      </div>
    </div>
    <div class="src" id="src"></div>
  </footer>
</div>

<script>
/*VIEW*/

const V = window.VIEW;
const $ = (id) => document.getElementById(id);
const deg = (n) => `<span class="n">${n}°</span>`;

/* ---------------- scene illustration ---------------- */
const W = 1016, H = 624, HZ = 420;
const FAIR = ['sunny', 'clear', 'partly'];
const WET = ['drizzle', 'rain', 'storm'];

function cloud(x, y, s, op, fill = '#FFFFFF') {
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}" opacity="${op}">
    <ellipse cx="0" cy="0" rx="70" ry="24"/><circle cx="-26" cy="-14" r="28"/>
    <circle cx="14" cy="-26" r="36"/><circle cx="50" cy="-8" r="22"/></g>`;
}

function scene(key) {
  const fair = FAIR.includes(key);
  const sky = fair ? ['#0A5FBD', '#2A8FE0', '#6FBFF1', '#FFE6B8'] : ['#3D5870', '#5E7B93', '#9EB3C4', '#DCE3E8'];
  const sea = fair ? ['#0E6A93', '#1592B0', '#43C2C9'] : ['#34637A', '#4E8696', '#79AEB4'];
  const sun = { x: 250, y: 300 };
  let s = `<svg class="bg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${sky[0]}"/><stop offset=".5" stop-color="${sky[1]}"/>
      <stop offset=".86" stop-color="${sky[2]}"/><stop offset="1" stop-color="${sky[3]}"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${sea[0]}"/><stop offset=".45" stop-color="${sea[1]}"/><stop offset="1" stop-color="${sea[2]}"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E4BC"/><stop offset="1" stop-color="#E7C48A"/></linearGradient>
    <radialGradient id="glow" cx="${sun.x}" cy="${sun.y}" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1BF" stop-opacity=".85"/><stop offset=".3" stop-color="#FFD978" stop-opacity=".32"/>
      <stop offset="1" stop-color="#FFD978" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx="40%" cy="36%" r="70%">
      <stop offset="0" stop-color="#FFFBE6"/><stop offset=".45" stop-color="#FFD54F"/><stop offset="1" stop-color="#FFA726"/></radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4DC" stop-opacity="0"/><stop offset="1" stop-color="#FFF4DC" stop-opacity="${fair ? .55 : .35}"/></linearGradient>
  </defs>
  <rect width="${W}" height="${HZ}" fill="url(#sky)"/>`;

  if (fair) {
    s += `<circle cx="${sun.x}" cy="${sun.y}" r="260" fill="url(#glow)"/>
      <circle cx="${sun.x}" cy="${sun.y}" r="128" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
      <circle cx="${sun.x}" cy="${sun.y}" r="164" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
      <circle cx="${sun.x}" cy="${sun.y}" r="92" fill="url(#core)"/>`;
    s += cloud(462, 398, .6, .85) + cloud(96, 406, .5, .7);
    if (key === 'partly') s += cloud(330, 352, 1.35, .96);
  } else {
    s += cloud(180, 150, 1.6, .55, '#E9EEF2') + cloud(560, 110, 1.9, .5, '#E9EEF2') + cloud(900, 190, 1.4, .5, '#E9EEF2');
    s += cloud(320, 300, 1.5, .8, '#F2F5F7') + cloud(760, 330, 1.2, .75, '#F2F5F7');
    if (WET.includes(key)) {
      let rain = '';
      for (let i = 0; i < 70; i++) {
        const x = (i * 149) % W, y = 160 + ((i * 89) % 240);
        rain += `<line x1="${x}" y1="${y}" x2="${x - 8}" y2="${y + 26}"/>`;
      }
      s += `<g stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round">${rain}</g>`;
    }
  }
  s += `<rect y="${HZ - 80}" width="${W}" height="80" fill="url(#haze)"/>`;

  /* sea */
  s += `<rect y="${HZ}" width="${W}" height="${H - HZ}" fill="url(#sea)"/>
    <line x1="0" y1="${HZ + .5}" x2="${W}" y2="${HZ + .5}" stroke="#fff" stroke-opacity=".35"/>`;
  let glints = '';
  for (let i = 0; i < 26; i++) {
    const x = 30 + ((i * 263) % (W - 60)), y = HZ + 12 + ((i * 37) % 70), w = 10 + (i % 4) * 8;
    glints += `<line x1="${x}" y1="${y}" x2="${x + w}" y2="${y}"/>`;
  }
  s += `<g stroke="#fff" stroke-opacity=".32" stroke-width="2.5" stroke-linecap="round">${glints}</g>`;
  if (fair) {
    let col = '';
    for (let i = 0; i < 7; i++) {
      const w = 70 - i * 7, y = HZ + 8 + i * 11;
      col += `<line x1="${sun.x - w / 2 + (i % 2) * 6}" y1="${y}" x2="${sun.x + w / 2}" y2="${y}"/>`;
    }
    s += `<g stroke="#FFF3C4" stroke-opacity=".75" stroke-width="4" stroke-linecap="round">${col}</g>`;
  }

  /* fishing boat */
  s += `<g transform="translate(560 ${HZ + 34}) scale(.9)">
      <path d="M-44 0 H48 L36 15 H-34 Z" fill="#0B2E4A"/>
      <rect x="-6" y="-14" width="26" height="14" rx="2" fill="#F7F1E2"/>
      <line x1="-20" y1="0" x2="-20" y2="-58" stroke="#0B2E4A" stroke-width="3"/>
      <path d="M-18 -56 L-18 -6 L22 -6 Z" fill="#fff"/>
      <path d="M-22 -58 L-38 -52 L-22 -46 Z" fill="#E0702A"/>
      <path d="M-40 21 H44" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
    </g>`;

  /* shoreline + sand */
  const shore = (dy) => `M0 ${HZ + 92 + dy} C 180 ${HZ + 72 + dy} 380 ${HZ + 106 + dy} 560 ${HZ + 88 + dy} S 880 ${HZ + 70 + dy} ${W} ${HZ + 90 + dy}`;
  s += `<path d="${shore(-14)}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
    <path d="${shore(-4)} V${H} H0Z" fill="#D9B579" opacity=".55"/>
    <path d="${shore(0)} V${H} H0Z" fill="url(#sand)"/>
    <path d="${shore(-3)}" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>`;
  return s + `</svg>`;
}

/* ---------------- small weather icons (64×64) ---------------- */
const DEFS = `<defs>
  <radialGradient id="sunI" cx="40%" cy="36%" r="70%"><stop offset="0" stop-color="#FFF6CF"/><stop offset=".5" stop-color="#FFC93C"/><stop offset="1" stop-color="#F7971E"/></radialGradient>
  <linearGradient id="cloudI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6EEF5"/><stop offset="1" stop-color="#B9CADA"/></linearGradient>
  <linearGradient id="cloudJ" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9C7D4"/><stop offset="1" stop-color="#8396AA"/></linearGradient></defs>`;
function rays(cx, cy, r1, r2, n, w) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n + Math.PI / 8;
    s += `<line x1="${cx + r1 * Math.cos(a)}" y1="${cy + r1 * Math.sin(a)}" x2="${cx + r2 * Math.cos(a)}" y2="${cy + r2 * Math.sin(a)}" stroke="#FFB627" stroke-width="${w}" stroke-linecap="round"/>`;
  }
  return s;
}
const CL = (dx = 0, dy = 0, s = 1, f = 'url(#cloudI)') =>
  `<path transform="translate(${dx} ${dy}) scale(${s})" fill="${f}" d="M18 50h28a10 10 0 0 0 1.6-19.9A14 14 0 0 0 20.6 27 11.5 11.5 0 0 0 18 50z"/>`;
const ICONS = {
  sunny: () => `${rays(32, 32, 19, 27, 8, 3.6)}<circle cx="32" cy="32" r="14" fill="url(#sunI)"/>`,
  clear: () => ICONS.sunny(),
  partly: () => `${rays(24, 24, 14, 20, 8, 3)}<circle cx="24" cy="24" r="10" fill="url(#sunI)"/>${CL(4, 6, .92)}`,
  cloudy: () => `${CL(-6, -6, .8, 'url(#cloudJ)')}${CL(2, 4, .95)}`,
  fog: () => `${CL(0, -6, .95)}<g stroke="#9FB2C4" stroke-width="3" stroke-linecap="round"><line x1="14" y1="52" x2="50" y2="52"/><line x1="20" y1="58" x2="44" y2="58"/></g>`,
  drizzle: () => `${CL(0, -8, .95)}<g stroke="#0E93B3" stroke-width="3" stroke-linecap="round"><line x1="24" y1="50" x2="22" y2="55"/><line x1="34" y1="50" x2="32" y2="55"/><line x1="44" y1="50" x2="42" y2="55"/></g>`,
  rain: () => `${CL(0, -8, .95, 'url(#cloudJ)')}<g stroke="#0E93B3" stroke-width="3.2" stroke-linecap="round"><line x1="22" y1="48" x2="18" y2="58"/><line x1="32" y1="48" x2="28" y2="58"/><line x1="42" y1="48" x2="38" y2="58"/></g>`,
  snow: () => `${CL(0, -8, .95)}<g fill="#7FB8D6"><circle cx="22" cy="52" r="2.6"/><circle cx="32" cy="57" r="2.6"/><circle cx="42" cy="52" r="2.6"/></g>`,
  storm: () => `${CL(0, -8, .95, 'url(#cloudJ)')}<path d="M34 44 L26 56 h7 l-4 9 L40 51 h-7 l4-7z" fill="#FFB627"/>`,
};
const icon = (key, cls = '') => `<svg class="${cls}" viewBox="0 0 64 64">${DEFS}${(ICONS[key] || ICONS.sunny)()}</svg>`;

/* ---------------- stat icons ---------------- */
const STAT = {
  humidity: { bg: '#E0F3F8', c: '#0E93B3', svg: (c) => `<svg viewBox="0 0 28 28" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3.5c4.2 5.6 7.5 9.8 7.5 13.7a7.5 7.5 0 0 1-15 0C6.5 13.3 9.8 9.1 14 3.5z"/><path d="M10.5 18a3.5 3.5 0 0 0 3.5 3.5"/></svg>` },
  rain: { bg: '#E6EEFB', c: '#2F6BD8', svg: (c) => `<svg viewBox="0 0 28 28" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 14a10.5 10.5 0 0 1 21 0z"/><path d="M14 14v7.5a2.8 2.8 0 0 1-5.6 0"/><path d="M14 2v1.5"/></svg>` },
  sunrise: { bg: '#FFF2DA', c: '#E58A12', svg: (c) => `<svg viewBox="0 0 28 28" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20a7 7 0 0 1 14 0"/><path d="M3 23.5h22"/><path d="M14 3v7"/><path d="M11 6l3-3 3 3"/><path d="M5 13.5l1.5 1.5M23 13.5L21.5 15"/></svg>` },
  sunset: { bg: '#FDE8DC', c: '#D0571C', svg: (c) => `<svg viewBox="0 0 28 28" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20a7 7 0 0 1 14 0"/><path d="M3 23.5h22"/><path d="M14 3v7"/><path d="M11 7l3 3 3-3"/><path d="M5 13.5l1.5 1.5M23 13.5L21.5 15"/></svg>` },
};

/* ---------------- olive branch ---------------- */
function branch() {
  /* gently curved stem; each leaf grows out of it at ±38°, alternating sides */
  const P = (t) => [20 + 150 * t + 30 * Math.sin(Math.PI * t), 190 - 165 * t + 10 * Math.sin(Math.PI * t)];
  let leaves = '', olives = '';
  for (let i = 0; i < 9; i++) {
    const t = .1 + i * .095, [x, y] = P(t), [x2, y2] = P(t + .01);
    const stem = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI;
    const a = stem + (i % 2 ? 38 : -38), r = a * Math.PI / 180, len = 30 - i * 1.2;
    leaves += `<ellipse cx="${x + Math.cos(r) * len}" cy="${y + Math.sin(r) * len}" rx="${len}" ry="${len * .3}" transform="rotate(${a} ${x + Math.cos(r) * len} ${y + Math.sin(r) * len})"/>`;
    if (i === 2 || i === 5) {
      const o = (a + (i % 2 ? 50 : -50)) * Math.PI / 180;
      olives += `<ellipse cx="${x + Math.cos(o) * 16}" cy="${y + Math.sin(o) * 16}" rx="8" ry="10.5"/>`;
    }
  }
  const [ex, ey] = P(1);
  leaves += `<ellipse cx="${ex + 10}" cy="${ey - 12}" rx="20" ry="6.5" transform="rotate(-50 ${ex + 10} ${ey - 12})"/>`;
  let d = 'M' + P(0).join(' ');
  for (let t = .05; t <= 1.001; t += .05) d += ' L' + P(t).join(' ');
  return `<path d="${d}" fill="none" stroke="#F7F1E2" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="#F7F1E2">${leaves}</g><g fill="#F7F1E2" opacity=".75">${olives}</g>`;
}

/* ---------------- temperature chart ---------------- */
function smooth(p) {
  let d = `M${p[0][0]} ${p[0][1]}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
  }
  return d;
}
function chart(el) {
  const w = el.clientWidth, h = el.clientHeight, n = V.week.length, cw = w / n;
  const top = 30, bottom = h - 36;
  const lo = V.weekMin, hi = V.weekMax, k = (bottom - top) / Math.max(1, hi - lo);
  const y = (t) => bottom - (t - lo) * k;
  const x = (i) => w - (i + .5) * cw;                 /* RTL: today on the right */
  const HP = V.week.map((d, i) => [x(i), y(d.highN)]);
  const LP = V.week.map((d, i) => [x(i), y(d.lowN)]);
  const area = smooth(HP) + ' L' + smooth([...LP].reverse()).slice(1) + ' Z';
  const dots = (P, c) => P.map(([a, b]) => `<circle cx="${a}" cy="${b}" r="6.5" fill="${c}" stroke="#fff" stroke-width="3"/>`).join('');
  const labels = V.week.map((d, i) => `
    <text x="${x(i)}" y="${HP[i][1] - 14}" text-anchor="middle" font-family="Alexandria" font-weight="800" font-size="21" fill="#0B2E4A" direction="ltr">${d.highN}°</text>
    <text x="${x(i)}" y="${LP[i][1] + 28}" text-anchor="middle" font-family="Alexandria" font-weight="600" font-size="17" fill="#4E6274" direction="ltr">${d.lowN}°</text>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0702A" stop-opacity=".16"/><stop offset="1" stop-color="#0E93B3" stop-opacity=".16"/></linearGradient></defs>
    <path d="${area}" fill="url(#band)"/>
    <path d="${smooth(HP)}" fill="none" stroke="#E0702A" stroke-width="4" stroke-linecap="round"/>
    <path d="${smooth(LP)}" fill="none" stroke="#0E93B3" stroke-width="4" stroke-linecap="round"/>
    ${dots(HP, '#E0702A')}${dots(LP, '#0E93B3')}${labels}</svg>`;
}

/* ---------------- fill ---------------- */

  `<span class="chip">${arrow(false, '#0E93B3')}الصغرى <b>${deg(V.hero.low)}</b></span>`;

$('stats').innerHTML = V.stats.map((s) => {
  const t = STAT[s.icon];
  return `<div class="stat"><div class="badge" style="background:${t.bg}">${t.svg(t.c)}</div>
    <div><div class="k">${s.k}</div><div class="v">${s.v}</div></div></div>`;
}).join('');

$('span').textContent = V.span;
$('cols').innerHTML = V.week.map((d, i) => `
  <div class="col ${i === 0 ? 'today' : ''}">
    <div class="dn">${d.name}</div><div class="dd">${d.date}</div>${icon(d.key, 'ic')}
  </div>`).join('');

$('branchR').innerHTML = branch();
$('branchL').innerHTML = branch();
$('htag').textContent = V.hadith.tag;
$('hlead').textContent = V.hadith.lead;
$('hquote').textContent = V.hadith.quote;
$('href').innerHTML = V.hadith.ref;

$('qr').innerHTML = V.qr;
$('src').innerHTML = V.src;

document.fonts.ready.then(() => {
  chart($('chart'));
  document.body.dataset.ready = '1';
});
</script>
